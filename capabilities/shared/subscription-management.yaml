naftiko: "1.0.0-alpha1"

info:
  label: "Red Hat Subscription Management API"
  description: "Manage RHEL subscriptions, entitlements, system registrations, and allocations using OAuth 2.0 authentication."
  tags:
    - Entitlements
    - Red Hat
    - RHEL
    - Subscription Management
    - Systems Management
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      REDHAT_OAUTH_TOKEN: REDHAT_OAUTH_TOKEN

capability:
  consumes:
    - type: http
      namespace: rhel-subscription
      baseUri: https://api.access.redhat.com/management/v1
      description: "Red Hat Subscription Management API."
      authentication:
        type: bearer
        token: "{{REDHAT_OAUTH_TOKEN}}"
      resources:
        - name: systems
          path: /systems
          description: "Registered RHEL systems"
          operations:
            - name: list-systems
              method: GET
              description: "List systems registered with Red Hat Subscription Management"
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of systems to return"
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Offset for pagination"
              outputRawFormat: json
              outputParameters:
                - name: systems
                  type: object
                  value: "$."
            - name: get-system
              method: GET
              description: "Get a specific registered system by UUID"
              inputParameters:
                - name: uuid
                  in: path
                  type: string
                  required: true
                  description: "System UUID"
              outputRawFormat: json
              outputParameters:
                - name: system
                  type: object
                  value: "$."
        - name: subscriptions
          path: /subscriptions
          description: "Account subscriptions"
          operations:
            - name: list-subscriptions
              method: GET
              description: "List subscriptions associated with the Red Hat account"
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Number of subscriptions to return"
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Pagination offset"
              outputRawFormat: json
              outputParameters:
                - name: subscriptions
                  type: object
                  value: "$."
        - name: allocations
          path: /allocations
          description: "Subscription allocations"
          operations:
            - name: list-allocations
              method: GET
              description: "List subscription allocations for the account"
              outputRawFormat: json
              outputParameters:
                - name: allocations
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: rhel-subscription-api
      resources:
        - path: /v1/systems
          name: systems
          description: "Registered systems"
          operations:
            - method: GET
              name: list-systems
              description: "List registered RHEL systems"
              call: "rhel-subscription.list-systems"
              with:
                limit: "rest.limit"
                offset: "rest.offset"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/subscriptions
          name: subscriptions
          description: "Account subscriptions"
          operations:
            - method: GET
              name: list-subscriptions
              description: "List account subscriptions"
              call: "rhel-subscription.list-subscriptions"
              with:
                limit: "rest.limit"
                offset: "rest.offset"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/allocations
          name: allocations
          description: "Subscription allocations"
          operations:
            - method: GET
              name: list-allocations
              description: "List subscription allocations"
              call: "rhel-subscription.list-allocations"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: rhel-subscription-mcp
      transport: http
      tools:
        - name: list-systems
          description: "List all RHEL systems registered with subscription management"
          hints:
            readOnly: true
            openWorld: true
          call: "rhel-subscription.list-systems"
          with:
            limit: "tools.limit"
            offset: "tools.offset"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-system
          description: "Get details for a specific registered RHEL system"
          hints:
            readOnly: true
            openWorld: true
          call: "rhel-subscription.get-system"
          with:
            uuid: "tools.uuid"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-subscriptions
          description: "List all subscriptions for the Red Hat account"
          hints:
            readOnly: true
            openWorld: true
          call: "rhel-subscription.list-subscriptions"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-allocations
          description: "List subscription allocations and entitlement details"
          hints:
            readOnly: true
            openWorld: true
          call: "rhel-subscription.list-allocations"
          outputParameters:
            - type: object
              mapping: "$."
