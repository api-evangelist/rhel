specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Red Hat Enterprise Linux
providerId: rhel
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Linux
  - Operating System
  - Red Hat
  - RHEL
  - Subscription Management
  - Enterprise
description: >-
  Red Hat Enterprise Linux is sold as annual entitlement-based subscriptions, with pricing set
  per host (physical or virtual), per socket-pair, or per virtual datacenter. There is also a
  no-cost Red Hat Developer Subscription that provides up to 16 entitlements for personal
  use and up to 25 entitlements per registered user for business development. The RHEL APIs
  exposed via the Red Hat Hybrid Cloud Console (Insights, Subscription Management, Patch,
  Vulnerability, Compliance) are included with an entitled subscription rather than priced
  separately.
sources:
  - https://www.redhat.com/en/store/linux-platforms
  - https://developers.redhat.com/products/rhel/overview
  - https://console.redhat.com/
plans:
  - id: rhel-developer-subscription
    name: Red Hat Developer Subscription for Individuals
    type: freemium
    description: >-
      No-cost subscription for individual developers. Up to 16 entitlements per registered
      user for personal development and small-scale production-style testing. Includes access
      to RHEL, the Hybrid Cloud Console APIs, and developer-focused documentation.
    entries:
      - label: RHEL Entitlements (Individual)
        name: rhel_entitlements_individual
        type: quota
        metric: entitlement
        limit: 16
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: RHEL Latest Version Download
      - name: No-Cost Sandbox Environments
      - name: Hybrid Cloud Console API Access
      - name: Developer Documentation
  - id: rhel-developer-subscription-business
    name: Red Hat Developer Subscription for Teams
    type: freemium
    description: >-
      No-cost subscription extending developer access for business use. Up to 25 entitlements
      per registered user within an organization for development and testing.
    entries:
      - label: RHEL Entitlements (Team)
        name: rhel_entitlements_team
        type: quota
        metric: entitlement
        limit: 25
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: true
    elements:
      - name: RHEL for Business Development Use
      - name: Team-Scale Testing
      - name: Hybrid Cloud Console API Access
  - id: rhel-server
    name: Red Hat Enterprise Linux Server
    type: subscription
    description: >-
      Production server subscription deployable on physical, virtual, or cloud infrastructure.
      Standard and Premium support options are sold separately on top of the base SKU.
    entries:
      - label: RHEL Server Annual Subscription
        name: rhel_server_subscription
        type: subscription
        metric: host
        limit: 1
        timeFrame: year
        geo: global
        unit: 1
        price: 'starting at $383.90'
        userMultiplied: false
    elements:
      - name: Red Hat Insights
      - name: Subscription Manager
      - name: Hybrid Cloud Console API
      - name: Support (Standard or Premium)
  - id: rhel-workstation
    name: Red Hat Enterprise Linux Workstation
    type: subscription
    description: >-
      Workstation subscription optimized for high-performance graphics, animation, and
      scientific computing, with developer tools included.
    entries:
      - label: RHEL Workstation Annual Subscription
        name: rhel_workstation_subscription
        type: subscription
        metric: workstation
        limit: 1
        timeFrame: year
        geo: global
        unit: 1
        price: 'starting at $196.90'
        userMultiplied: false
    elements:
      - name: Developer Tools
      - name: Workstation-Focused Support
  - id: rhel-power
    name: Red Hat Enterprise Linux for IBM Power Little Endian
    type: subscription
    description: >-
      RHEL tailored for POWER8 and later IBM Power Systems.
    entries:
      - label: RHEL on Power Annual Subscription
        name: rhel_power_subscription
        type: subscription
        metric: socket-pair
        limit: 1
        timeFrame: year
        geo: global
        unit: 1
        price: 'starting at $295.90'
        userMultiplied: false
    elements:
      - name: IBM Power Optimization
  - id: rhel-sap
    name: Red Hat Enterprise Linux for SAP Solutions
    type: subscription
    description: >-
      RHEL tuned for SAP workloads with high-availability features and certified SAP HANA
      configurations.
    entries:
      - label: RHEL for SAP Annual Subscription
        name: rhel_sap_subscription
        type: subscription
        metric: host
        limit: 1
        timeFrame: year
        geo: global
        unit: 1
        price: 'starting at $1,923.90'
        userMultiplied: false
    elements:
      - name: SAP HANA Certification
      - name: High-Availability Add-Ons
  - id: rhel-virtual-datacenters
    name: Red Hat Enterprise Linux for Virtual Datacenters
    type: subscription
    description: >-
      Per-host subscription that includes unlimited RHEL guest entitlement on the host's
      hypervisor, designed for high-density virtualization.
    entries:
      - label: RHEL for Virtual Datacenters Annual Subscription
        name: rhel_vdc_subscription
        type: subscription
        metric: host
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: 'starting at $2,748.90'
        userMultiplied: false
    elements:
      - name: Unlimited Guest Entitlement
      - name: Virtual Datacenter Optimization
