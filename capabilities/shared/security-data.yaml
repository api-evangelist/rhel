naftiko: "1.0.0-alpha1"

info:
  label: "Red Hat Security Data API"
  description: "Access CVE data, CSAF security advisories, and OVAL vulnerability assessment data for Red Hat Enterprise Linux products."
  tags:
    - CVE
    - Red Hat
    - Security
    - Vulnerability Management
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      REDHAT_OAUTH_TOKEN: REDHAT_OAUTH_TOKEN

capability:
  consumes:
    - type: http
      namespace: rhel-security-data
      baseUri: https://access.redhat.com/hydra/rest/securitydata
      description: "Red Hat Security Data API for CVE and advisory data."
      resources:
        - name: cves
          path: /cve.json
          description: "CVE list and detail operations"
          operations:
            - name: list-cves
              method: GET
              description: "List recent CVEs affecting Red Hat products"
              inputParameters:
                - name: before
                  in: query
                  type: string
                  required: false
                  description: "Return CVEs before this date (YYYY-MM-DD)"
                - name: after
                  in: query
                  type: string
                  required: false
                  description: "Return CVEs after this date (YYYY-MM-DD)"
                - name: product
                  in: query
                  type: string
                  required: false
                  description: "Filter by Red Hat product name"
                - name: severity
                  in: query
                  type: string
                  required: false
                  description: "Filter by severity level (Low, Moderate, Important, Critical)"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Number of results per page"
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
              outputRawFormat: json
              outputParameters:
                - name: cves
                  type: array
                  value: "$."
        - name: cve-detail
          path: /cve/{cveId}.json
          description: "Single CVE detail"
          operations:
            - name: get-cve
              method: GET
              description: "Get detailed CVE information by CVE ID"
              inputParameters:
                - name: cveId
                  in: path
                  type: string
                  required: true
                  description: "CVE identifier (e.g., CVE-2021-23358)"
              outputRawFormat: json
              outputParameters:
                - name: cve
                  type: object
                  value: "$."
        - name: advisory
          path: /cvrf/{advisoryId}.json
          description: "Security advisory detail"
          operations:
            - name: get-advisory
              method: GET
              description: "Get Red Hat Security Advisory by ID"
              inputParameters:
                - name: advisoryId
                  in: path
                  type: string
                  required: true
                  description: "Advisory ID (e.g., RHSA-2021:2865)"
              outputRawFormat: json
              outputParameters:
                - name: advisory
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: rhel-security-data-api
      resources:
        - path: /v1/cves
          name: cves
          description: "CVE list endpoint"
          operations:
            - method: GET
              name: list-cves
              description: "List CVEs with filtering"
              call: "rhel-security-data.list-cves"
              with:
                before: "rest.before"
                after: "rest.after"
                product: "rest.product"
                severity: "rest.severity"
              outputParameters:
                - type: array
                  mapping: "$."
        - path: /v1/cves/{cveId}
          name: cve-detail
          description: "Single CVE detail"
          operations:
            - method: GET
              name: get-cve
              description: "Get CVE by ID"
              call: "rhel-security-data.get-cve"
              with:
                cveId: "rest.cveId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/advisories/{advisoryId}
          name: advisory
          description: "Security advisory"
          operations:
            - method: GET
              name: get-advisory
              description: "Get advisory by ID"
              call: "rhel-security-data.get-advisory"
              with:
                advisoryId: "rest.advisoryId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: rhel-security-data-mcp
      transport: http
      tools:
        - name: list-cves
          description: "List CVEs affecting Red Hat products with severity and date filtering"
          hints:
            readOnly: true
            openWorld: true
          call: "rhel-security-data.list-cves"
          with:
            before: "tools.before"
            after: "tools.after"
            product: "tools.product"
            severity: "tools.severity"
          outputParameters:
            - type: array
              mapping: "$."
        - name: get-cve
          description: "Get full CVE details including affected packages and fix status"
          hints:
            readOnly: true
            openWorld: true
          call: "rhel-security-data.get-cve"
          with:
            cveId: "tools.cveId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-advisory
          description: "Get Red Hat Security Advisory with package fix information"
          hints:
            readOnly: true
            openWorld: true
          call: "rhel-security-data.get-advisory"
          with:
            advisoryId: "tools.advisoryId"
          outputParameters:
            - type: object
              mapping: "$."
