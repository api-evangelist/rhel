specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Red Hat Enterprise Linux
providerId: rhel
publisherName: Red Hat, Inc.
serviceCategory: Operating System Subscription
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Red Hat
  - RHEL
  - Linux
  - Subscription
  - FinOps
  - FOCUS
description: >-
  FOCUS-aligned FinOps shape for RHEL: per-entitlement annual subscriptions, optionally
  layered with cloud-marketplace consumption (AWS, Azure, GCP) for pay-as-you-go RHEL hosts.
  No-cost developer entitlements are excluded from billing.
sources:
  - https://www.redhat.com/en/store/linux-platforms
  - https://developers.redhat.com/products/rhel/overview
  - https://console.redhat.com/
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Adjustment
focusColumns:
  ServiceName: Red Hat Enterprise Linux
  ServiceCategory: Operating System Subscription
  ProviderName: Red Hat
  PublisherName: Red Hat, Inc.
  InvoiceIssuerName: Red Hat, Inc.
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: rhel_entitlements
    description: Active RHEL subscription entitlements (host, socket-pair, or virtual datacenter)
    unit: entitlement
    aggregation: sum
    dimensions:
      - sku
      - support_level
      - region
  - name: rhel_marketplace_hours
    description: Pay-as-you-go RHEL hours billed via cloud marketplace (AWS, Azure, GCP)
    unit: instance-hour
    aggregation: sum
    dimensions:
      - cloud
      - instance_type
      - region
  - name: support_incidents
    description: Premium-support incidents opened against entitled subscriptions
    unit: incident
    aggregation: count
    dimensions:
      - severity
principles:
  - name: Visibility
    description: >-
      Use the Red Hat Hybrid Cloud Console (Subscription Manager, Subscription Watch) and the
      cloud marketplace usage feeds to reconcile entitled vs consumed RHEL hosts.
  - name: Allocation
    description: >-
      Tag RHEL hosts in Red Hat Insights and in the parent cloud invoice (AWS / Azure / GCP
      tags) so spend can be attributed to the consuming team or product.
  - name: Optimization
    description: >-
      Choose between fixed-term entitlements and pay-as-you-go marketplace hours based on
      utilization; consolidate hosts onto Virtual Datacenter SKUs where guest density is
      high; retire unused entitlements before renewal.
  - name: Accountability
    description: >-
      Platform engineering owns RHEL entitlement budgets; use Subscription Watch alerts to
      flag over-deployment ahead of the annual renewal cycle.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
